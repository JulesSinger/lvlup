<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <meta
      name="description"
      content="Atlas — un hub personnel, un module par domaine : objectifs, budget, révision espacée."
    />
    <title>Atlas — un module par domaine</title>
    <script>
      // Le thème avant le premier rendu, pour ne pas voir l'app en sombre
      // puis en clair. Même règle et même clé que src/core/lib/theme.ts.
      (function () {
        var choice = 'dark';
        try {
          choice = localStorage.getItem('atlas.theme.v1') || 'dark';
        } catch (e) {}
        var theme =
          choice === 'light' || choice === 'dark'
            ? choice
            : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'light' ? '#f4f5f9' : '#0b0e14');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
